# ============================================================
#  Prometheus — Configuração de scrape
# ============================================================

global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "passos-magicos-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          app: "passos-magicos"
          environment: "production"
