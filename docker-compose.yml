# ============================================================
#  Docker Compose — Datathon Passos Mágicos
#  Stack completo: API + Testes + Observabilidade
# ============================================================

services:

  # -------------------------------------------------------
  #  API FastAPI
  # -------------------------------------------------------
  api:
    build: .
    container_name: passos-magicos-api
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "api"
    networks:
      - observability

  # -------------------------------------------------------
  #  Testes automatizados (roda uma vez e encerra)
  # -------------------------------------------------------
  tests:
    build: .
    container_name: passos-magicos-tests
    command: [ "pytest", "tests/", "-v", "--cov=app", "--cov=src", "--cov-report=term-missing" ]
    depends_on:
      api:
        condition: service_healthy
    networks:
      - observability

  # -------------------------------------------------------
  #  Prometheus — Coleta de métricas
  # -------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: passos-magicos-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - observability

  # -------------------------------------------------------
  #  Loki — Agregação de logs
  # -------------------------------------------------------
  loki:
    image: grafana/loki:latest
    container_name: passos-magicos-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    restart: unless-stopped
    networks:
      - observability

  # -------------------------------------------------------
  #  Promtail — Coleta de logs dos containers
  # -------------------------------------------------------
  promtail:
    image: grafana/promtail:latest
    container_name: passos-magicos-promtail
    volumes:
      - ./observability/promtail.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - observability

  # -------------------------------------------------------
  #  Grafana — Dashboard de monitoramento
  # -------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: passos-magicos-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped
    networks:
      - observability

# -------------------------------------------------------
#  Volumes persistentes
# -------------------------------------------------------
volumes:
  prometheus_data:
  loki_data:
  grafana_data:

    # -------------------------------------------------------
    #  Rede interna
    # -------------------------------------------------------
networks:
  observability:
    driver: bridge
